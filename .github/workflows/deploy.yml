# Auto-deploy to the VPS on every push to main (replaces Railway's deploy-on-push).
# SSHes into the server, fast-forwards the checkout, and rebuilds the stack.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST       e.g. 203.0.113.10  (or the domain)
#   VPS_USER       e.g. deploy
#   VPS_SSH_KEY    private key whose public half is in the VPS user's authorized_keys
#   DEPLOY_PATH    absolute path to the repo on the VPS, e.g. /opt/real-time-agent-collab
# Optional:
#   VPS_PORT       SSH port (default 22)

name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            bash scripts/deploy.sh
