<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Setup</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #e1e1e1;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
    }

    .card {
      width: 100%;
      max-width: 600px;
    }

    .card-header {
      margin-bottom: 32px;
    }

    .card-header h1 {
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .card-header p {
      color: #666;
      margin-top: 6px;
      font-size: 13px;
    }

    .section {
      border: 1px solid #1e1e1e;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
      background: #111;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #555;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid #222;
      border-radius: 6px;
      color: #e1e1e1;
      font-size: 13px;
      padding: 8px 10px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus,
    input[type="email"]:focus {
      border-color: #444;
    }

    input[type="text"]::placeholder,
    input[type="email"]::placeholder {
      color: #333;
    }

    .field {
      margin-bottom: 14px;
    }

    .field:last-child { margin-bottom: 0; }

    .row {
      display: flex;
      gap: 8px;
    }

    .row .field { flex: 1; margin-bottom: 0; }

    .repo-row,
    .member-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      margin-bottom: 10px;
    }

    .repo-row .field,
    .member-row .field {
      margin-bottom: 0;
    }

    .repo-url { flex: 2; }
    .repo-name { flex: 1; }
    .member-name { flex: 1; }
    .member-email { flex: 2; }
    .member-role { flex: 1; }

    .primary-badge {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #3b82f6;
      background: #1e293b;
      border: 1px solid #1e3a5f;
      border-radius: 4px;
      padding: 2px 6px;
      white-space: nowrap;
      align-self: center;
      flex-shrink: 0;
    }

    .btn-remove {
      background: none;
      border: none;
      color: #444;
      font-size: 16px;
      cursor: pointer;
      padding: 6px 4px;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.15s;
    }

    .btn-remove:hover { color: #888; }

    .btn-add {
      background: none;
      border: 1px dashed #222;
      border-radius: 6px;
      color: #555;
      font-size: 12px;
      cursor: pointer;
      padding: 7px 12px;
      width: 100%;
      margin-top: 4px;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-add:hover { border-color: #444; color: #888; }

    .gh-repos {
      font-size: 12px;
      color: #555;
      margin-bottom: 12px;
      line-height: 1.8;
    }

    .gh-repos span {
      display: block;
      color: #777;
      font-family: 'SFMono-Regular', Consolas, monospace;
    }

    .gh-helper {
      font-size: 11px;
      color: #444;
      margin-top: 10px;
    }

    .btn-gh {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e1e1e1;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 14px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-gh:hover { background: #1c2128; border-color: #444; }

    .btn-submit {
      width: 100%;
      background: #fff;
      border: none;
      border-radius: 6px;
      color: #000;
      font-size: 13px;
      font-weight: 600;
      padding: 10px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s;
    }

    .btn-submit:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-submit:not(:disabled):hover { opacity: 0.88; }

    .error-banner {
      background: #1a0a0a;
      border: 1px solid #5c1a1a;
      border-radius: 6px;
      color: #f87171;
      font-size: 13px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }

    .success-banner {
      background: #0a1a0f;
      border: 1px solid #1a5c30;
      border-radius: 6px;
      color: #4ade80;
      font-size: 13px;
      padding: 16px;
      text-align: center;
    }

    .success-banner strong { display: block; font-size: 15px; margin-bottom: 4px; }

    .inline-error {
      font-size: 11px;
      color: #f87171;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" src="App.jsx"></script>
  <script type="text/babel" src="main.jsx"></script>
</body>
</html>
